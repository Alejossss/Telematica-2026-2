# docker-compose para la orquestacion del sistema completo (Punto 9).
#
# Levanta dos servicios hermanos en la misma red por defecto de compose
# (Red_Compose), que provee DNS interno:
#   - servidor-central: Servidor_Central en C (server/server_concurrent),
#     contenerizado via server/Dockerfile. Publica TCP 6000 y UDP 5000.
#   - servicio-web: Servicio_Web en Python (Punto 7), ya existente. Publica
#     HTTP 8080 y localiza al servidor por NOMBRE DNS del servicio de compose
#     (TSP_SERVER_HOST=servidor-central), NUNCA por IP fija.
#
# El binario del Servidor_Central ya lee sus puertos del entorno y enlaza a
# INADDR_ANY; no se modifica ninguna fuente C ni la logica del Servicio_Web.

services:
  # Servidor_Central en C contenerizado (Punto 9).
  servidor-central:
    build:
      # El contexto es la raiz del repo para copiar Makefile y server/ (Req. 3.2).
      context: .
      dockerfile: server/Dockerfile
    environment:
      # Puertos configurables por entorno; valores por defecto del Punto 9.
      - TSP_TCP_PORT=6000
      - TSP_UDP_PORT=5000
    ports:
      # Publica el puerto TCP de registro/comandos/alertas (Req. 3.3).
      - "6000:6000"
      # Publica el puerto UDP de telemetria (Req. 3.4).
      - "5000:5000/udp"

  # Servicio_Web en Python (Punto 7), ya existente.
  servicio-web:
    build:
      # El contexto es la raiz del repo para poder copiar clients/ y web/.
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      # Arranque ordenado: el servidor arranca antes que el web (Req. 4.x).
      - servidor-central
    environment:
      # TSP_SERVER_HOST es el nombre DNS del servicio del Servidor_Central en la
      # red del compose, NUNCA una IP fija (Req. 4.1, 4.2, 4.3).
      - TSP_SERVER_HOST=servidor-central
      - TSP_TCP_PORT=6000
      - WEB_PORT=8080
    ports:
      # Publica el puerto HTTP del Servicio_Web (Req. 3.5).
      - "8080:8080"
